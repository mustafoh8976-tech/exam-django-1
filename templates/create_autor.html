<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить автора</title>
</head>
<body>
    <h1>Добавить автора</h1>
    <form method="post">
        {% csrf_token %}
        <p>Имя: <input type="text" name="first_n" value="{{ first_n }}"></p>
        <p>Фамилия: <input type="text" name="last_n" value="{{ last_n }}"></p>
        <p>Возраст: <input type="number" name="age" value="{{ age }}"></p>
        <p>Страна: <input type="text" name="country" value="{{ country }}"></p>
        <input type="submit" value="Сохранить">
    </form>
    <p><a href="{% url 'list_autor' %}">Назад</a></p>
</body>
</html>
